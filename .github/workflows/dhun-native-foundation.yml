name: DHUN Native Foundation Verification

on:
  workflow_dispatch:
  push:
    branches: [main, windows-foundation]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-native-foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            **/NuGet.config
      - uses: FedericoCarboni/setup-ffmpeg@v3.1
      - name: Test DHUN core
        run: dotnet test tests/Dhun.Core.Tests/Dhun.Core.Tests.csproj -c Release --logger "trx;logfilename=foundation-tests.trx"
      - name: Create local empty app settings
        shell: pwsh
        run: |
          @{ Discord = @{ AppId = '' }; DhunApiServer = @{ Url = ''; ApiKey = '' } } |
            ConvertTo-Json -Depth 3 | Out-File src/Dhun.WinUI/appsettings.json -Encoding UTF8
      - name: Restore native Windows project
        run: dotnet restore src/Dhun.WinUI/Dhun.WinUI.csproj
      - name: Compile x64 DHUN native foundation
        run: >
          dotnet publish src/Dhun.WinUI/Dhun.WinUI.csproj
          -c Release -r win-x64
          -p:Platform=x64
          -p:PublishReadyToRun=true
          -p:GenerateAppxPackageOnBuild=false
          -p:AppxPackageSigningEnabled=False
          -p:PackageCertificateThumbprint=""
          -p:GenerateTemporaryStoreCertificate=False
      - name: Build unsigned x64 sideload MSIX
        run: >
          dotnet msbuild src/Dhun.WinUI/Dhun.WinUI.csproj
          /p:Configuration=Release /p:Platform=x64
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxBundle=Never
          /p:AppxPackageSigningEnabled=False
          /p:PackageCertificateThumbprint=""
          /p:GenerateTemporaryStoreCertificate=False
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxPackageDir=${{ github.workspace }}/artifacts/msix/
      - name: Upload unsigned native preview
        uses: actions/upload-artifact@v7.0.1
        with:
          name: DHUN-Native-0.1.0-unsigned-x64
          path: artifacts/msix/**
          if-no-files-found: error
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-foundation-diagnostics
          path: |
            **/foundation-tests.trx
            **/*.binlog
