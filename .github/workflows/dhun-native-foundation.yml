name: DHUN Native Foundation Verification

on:
  workflow_dispatch:
  push:
    branches: [main, windows-foundation]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-native-foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            **/NuGet.config
      - uses: FedericoCarboni/setup-ffmpeg@v3.1
      - name: Test DHUN core
        run: dotnet test tests/Dhun.Core.Tests/Dhun.Core.Tests.csproj -c Release --logger "trx;logfilename=foundation-tests.trx"
      - name: Create local empty app settings
        shell: pwsh
        run: |
          @{ Discord = @{ AppId = '' }; DhunApiServer = @{ Url = ''; ApiKey = '' } } |
            ConvertTo-Json -Depth 3 | Out-File src/Dhun.WinUI/appsettings.json -Encoding UTF8
      - name: Restore native Windows project
        run: dotnet restore src/Dhun.WinUI/Dhun.WinUI.csproj
      - name: Compile x64 DHUN native foundation
        run: >
          dotnet publish src/Dhun.WinUI/Dhun.WinUI.csproj
          -c Release -r win-x64
          -p:Platform=x64
          -p:PublishReadyToRun=true
          -p:GenerateAppxPackageOnBuild=false
          -p:AppxPackageSigningEnabled=False
          -p:PackageCertificateThumbprint=""
          -p:GenerateTemporaryStoreCertificate=False
      - name: Build unsigned x64 sideload MSIX
        run: >
          dotnet msbuild src/Dhun.WinUI/Dhun.WinUI.csproj
          /p:Configuration=Release /p:Platform=x64
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxBundle=Never
          /p:AppxPackageSigningEnabled=False
          /p:PackageCertificateThumbprint=""
          /p:GenerateTemporaryStoreCertificate=False
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxPackageDir=${{ github.workspace }}/artifacts/msix/
      - name: Install and smoke-test unsigned MSIX
        shell: pwsh
        run: |
          $msix = Get-ChildItem 'artifacts/msix' -Filter '*.msix' -Recurse | Select-Object -First 1
          if (-not $msix) { throw 'Unsigned DHUN MSIX was not found.' }
          Add-AppxPackage -Path $msix.FullName -AllowUnsigned
          $package = Get-AppxPackage -Name 'DhunMusic.Dhun'
          if (-not $package) { throw 'DHUN package registration failed.' }
          $manifest = Get-AppxPackageManifest -Package $package
          $appId = ($manifest.Package.Applications.Application | Select-Object -First 1).Id
          Start-Process "shell:AppsFolder\$($package.PackageFamilyName)!$appId"
          Start-Sleep -Seconds 20
          $process = Get-Process -Name 'DHUN' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $process) { throw 'DHUN did not remain alive during the packaged startup smoke test.' }
          Stop-Process -Id $process.Id -Force
          Remove-AppxPackage -Package $package.PackageFullName
          Write-Host 'DHUN packaged startup smoke test passed.'
      - name: Create portable x64 ZIP
        shell: pwsh
        run: |
          $publish = Get-ChildItem 'src/Dhun.WinUI/bin/Release' -Directory -Recurse |
            Where-Object { $_.Name -eq 'publish' -and (Test-Path (Join-Path $_.FullName 'DHUN.exe')) } |
            Select-Object -First 1
          if (-not $publish) { throw 'Published portable DHUN directory was not found.' }
          New-Item -ItemType Directory -Force 'artifacts/portable' | Out-Null
          Compress-Archive -Path (Join-Path $publish.FullName '*') -DestinationPath 'artifacts/portable/DHUN-Native-v1.0.0-x64-portable.zip' -CompressionLevel Optimal
      - name: Upload native preview packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: DHUN-Native-v1.0.0-Windows-x64
          path: |
            artifacts/msix/**
            artifacts/portable/*.zip
          if-no-files-found: error
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-foundation-diagnostics
          path: |
            **/foundation-tests.trx
            **/*.binlog
