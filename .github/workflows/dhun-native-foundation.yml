name: DHUN Native Foundation Verification

on:
  workflow_dispatch:
  push:
    branches: [main, windows-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-native-foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            **/NuGet.config
      - uses: FedericoCarboni/setup-ffmpeg@v3.1
      - name: Test DHUN core with coverage
        run: >
          dotnet test tests/Dhun.Core.Tests/Dhun.Core.Tests.csproj
          -c Release
          --logger "trx;logfilename=foundation-tests.trx"
          --collect "XPlat Code Coverage"
          --results-directory artifacts/test-results
      - name: Upload local coverage and test report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dhun-core-test-results
          path: artifacts/test-results/**
          retention-days: 14
      - name: Create local empty app settings
        shell: pwsh
        run: |
          @{ Discord = @{ AppId = '' }; DhunApiServer = @{ Url = ''; ApiKey = '' } } |
            ConvertTo-Json -Depth 3 | Out-File src/Dhun.WinUI/appsettings.json -Encoding UTF8
      - name: Restore native Windows project
        run: dotnet restore src/Dhun.WinUI/Dhun.WinUI.csproj
      - name: Compile x64 DHUN native foundation
        run: >
          dotnet publish src/Dhun.WinUI/Dhun.WinUI.csproj
          -c Release -r win-x64
          -p:Platform=x64
          -p:PublishReadyToRun=true
          -p:GenerateAppxPackageOnBuild=false
          -p:AppxPackageSigningEnabled=False
          -p:PackageCertificateThumbprint=""
          -p:GenerateTemporaryStoreCertificate=False
      - name: Build unsigned x64 sideload MSIX
        run: >
          dotnet msbuild src/Dhun.WinUI/Dhun.WinUI.csproj
          /p:Configuration=Release /p:Platform=x64
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxBundle=Never
          /p:AppxPackageSigningEnabled=False
          /p:PackageCertificateThumbprint=""
          /p:GenerateTemporaryStoreCertificate=False
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxPackageDir=${{ github.workspace }}/artifacts/msix/
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build complete Windows EXE installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc 'installer\DHUN.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }
      - name: Install EXE and smoke-test packaged DHUN
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'artifacts/installer' -Filter '*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'DHUN Setup.exe was not found.' }
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw "DHUN Setup.exe failed with code $($installer.ExitCode)." }
          $package = Get-AppxPackage -Name 'DhunMusic.Dhun'
          if (-not $package) { throw 'DHUN package registration failed after EXE installation.' }
          $manifest = Get-AppxPackageManifest -Package $package
          $appId = ($manifest.Package.Applications.Application | Select-Object -First 1).Id
          Start-Process "shell:AppsFolder\$($package.PackageFamilyName)!$appId"
          Start-Sleep -Seconds 20
          $process = Get-Process -Name 'DHUN' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $process) { throw 'DHUN did not remain alive during the packaged startup smoke test.' }
          Stop-Process -Id $process.Id -Force
          $uninstaller = Join-Path $env:ProgramFiles 'DHUN\unins000.exe'
          if (Test-Path $uninstaller) { Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait }
          Write-Host 'DHUN Setup.exe install/start/uninstall smoke test passed.'
      - name: Upload complete EXE installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: DHUN-Native-v1.0.0-Setup-x64
          path: artifacts/installer/DHUN-Native-v1.0.0-Setup-x64.exe
          if-no-files-found: error
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-foundation-diagnostics
          path: |
            **/foundation-tests.trx
            **/*.binlog
