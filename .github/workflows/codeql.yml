name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze-csharp:
    name: Analyze C#
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            **/NuGet.config
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - name: Build analyzed core
        run: dotnet build src/Dhun.Core/Dhun.Core.csproj -c Release
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:csharp'
